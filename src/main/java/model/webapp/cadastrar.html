<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Cadastro de Usuário</title>
</head>
<style>
    /* Reset básico e fontes */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background-color: #f0f2f5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        color: #333;
    }

    h1 {
        margin-bottom: 20px;
        color: #4a4a4a;
        font-weight: 600;
    }

    /* Estilização do Form */
    form[name="frmContato"] {
        background: #ffffff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
    }

    /* Tabela de layout (removendo bordas) */
    table {
        width: 100%;
        border-collapse: collapse;
    }

    td {
        padding: 10px 0;
    }

    /* Estilo dos Inputs */
    input[type="text"] {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
        transition: all 0.3s ease;
    }

    input[type="text"]:focus {
        outline: none;
        border-color: #007bff;
        box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.2);
    }

    /* Estilo do Botão */
    input[type="button"] {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background-color: #007bff;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 15px;
        transition: background-color 0.3s ease;
    }

    input[type="button"]:hover {
        background-color: #0056b3;
    }
</style>

<body>
	<h1>Cadastrar Usuário</h1>

	<form name="frmCadastroUsuario" action="cadastrar">

		<table>
			<tr>
				<td><input type="text" name="nome" placeholder="nome"></td>
			</tr>
			
			<tr>
				<td><input type="text" name="email" placeholder="Email"></td>
			</tr>
			<tr>
				<td><input type="text" name="senha" placeholder="Senha"></td>
			</tr>
		</table>
		<input type="button" onclick="validar2()" value="Adicionar">






	</form>
	<script src="scripts/validador.js"></script>
</body>
</html>
